services:
  - type: web
    name: ergocare-backend
    runtime: python
    rootDir: ergo_ml_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Admin login - secrets are entered in the Render dashboard, never committed here
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      # Same value as DEVICE_TOKEN in firmware/ergocare_wearable/secrets.h - without it
      # anyone who knows a device id can post fake readings to this public server
      - key: DEVICE_INGEST_TOKEN
        sync: false
      - key: AUDIO_UPLOAD_DIR
        value: /opt/render/project/src/uploads/audio
      - key: ALLOWED_ORIGINS
        value: https://ergocare-ai.vercel.app
